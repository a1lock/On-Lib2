{% extends 'base.html' %}

{% block content %}
    <h1>Каталог книг</h1>

    <!-- Форма поиска -->
    <form method="GET" action="{% url 'catalog' %}" class="search-form">
        <input type="text" name="q" value="{{ search_query }}" placeholder="Найти книгу по названию или автору...">
        <button type="submit" class="btn">Найти</button>
    </form>

    <!-- Заголовок секции -->
    <h2 class="section-title">Все книги</h2>

    <!-- Сетка с книгами -->
    <div class="books-grid">
        {% for book in books %}
            <a href="{% url 'book_detail' book.id %}" class="book-card-link">
                <div class="book-card">
                    {% if book.cover_image %}
                        <img src="{{ book.cover_image.url }}" alt="{{ book.title }}" class="cover-placeholder">
                    {% else %}
                        <div class="cover-placeholder"></div>
                    {% endif %}
                    <h3>{{ book.title }}</h3>
                    <p>{{ book.author }}</p>
                </div>
            </a>
        {% empty %}
            <p>По вашему запросу ничего не найдено.</p>
        {% endfor %}
    </div>
{% endblock %}
